name: Release ympatcher

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          args=(--check-branch)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python scripts/check_release.py "${args[@]}"
          python scripts/check_publication.py
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all --locked
      - run: cargo build --release --locked
      - name: Package executable and checksum
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish channel release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version release.json)"
          lane="$(jq -r .lane release.json)"
          tag="v$version"
          title="ympatcher $tag · $lane"
          flags=(--latest)
          [[ "$lane" == "dev" ]] && flags=(--prerelease --latest=false)
          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            target="$(git rev-parse "$tag^{commit}")"
            [[ "$target" == "$GITHUB_SHA" ]] || { echo "Tag belongs to another commit" >&2; exit 1; }
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" "${flags[@]}"
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" \
              --notes-file CHANGELOG.md "${flags[@]}"
          fi
