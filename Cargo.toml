[package]
name = "ympatcher"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Pyanexya aka Pyanexy"]
description = "Guarded Rust patcher for the Yandex Music Android client"
repository = "https://github.com/pyanexya/ympatcher"
homepage = "https://github.com/pyanexya/ympatcher"

[[bin]]
name = "ympatcher"
path = "rust/main.rs"

[lib]
name = "ympatcher"
path = "rust/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6.0"
hex = "0.4"
rand = "0.8"
rayon = "1.11"
regex = "1.11"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ctrlc = "3.4"
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
